:#166534}.layout{min-height:100vh;display:flex}.sidebar{width:250px;background:linear-gradient(180deg,#ffffff 0%,#f6f0ff 100%);color:#18324f;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:18px;z-index:40;overflow:auto}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.brand b{font-size:18px}.brandLogo{width:38px;height:38px;border-radius:11px;background:var(--red);display:grid;place-items:center;font-weight:900}.sideNav{display:grid;gap:5px}.navGroup{font-size:9px;font-weight:900;letter-spacing:1.2px;color:#91a4ba;padding:14px 10px 5px}.navGroupWrap{display:grid;gap:5px}.sideNav button{border:0;background:transparent;color:#52677f;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700}.sideNav button.active,.sideNav button:hover{background:#e8f2ff;color:#1459a6}.main{margin-left:250px;flex:1;min-width:0}.top{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(242,233,255,.96));backdrop-filter:blur(8px);height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.mobileMenu{display:none}.content{padding:20px;max-width:1550px;margin:auto}.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.title h1{font-size:22px;margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:15px}.metric small{color:var(--muted);font-size:10px}.metric strong{font-size:24px;display:block;margin-top:5px}.panel{margin-top:14px}.panel h3{font-size:14px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{min-width:220px;flex:1}.table{overflow:auto}.tr{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:11px 4px;font-size:11px;min-width:760px}.tr.head{font-weight:900;color:var(--muted);font-size:9px}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;background:#f2f2f4;font-size:9px;font-weight:900}.green{color:var(--green)}.amber{color:var(--amber)}.dangerText{color:var(--danger)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#0008;z-index:80;display:grid;place-items:center;padding:18px}.modalBox{background:white;border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modalHead h2{font-size:17px;margin:0}.close{border:0;background:#f1f1f3;width:34px;height:34px;border-radius:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.drawerOverlay{display:none}.hint{font-size:11px;color:var(--muted);line-height:1.6}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:0;border-radius:9px;padding:8px 11px;background:#f1f1f3;font-size:11px;font-weight:800}.tabs button.active{background:#1765bd;color:#fff}

<script type="module">
let initializeApp,getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword,reauthenticateWithCredential,EmailAuthProvider;
let getDatabase,ref,get,set,update,push,remove,runTransaction,query,orderByChild,equalTo;
let auth=null,db=null;
// এই Firebase config index_updated_v2.html-এর splora-7abad project থেকে নেওয়া হয়েছে।
const firebaseConfig = {
      apiKey: "AIzaSyAXxxJS_hqkjGyMUlI0Fu1lhWPkSFzr_Hk",
      authDomain: "splora-7abad.firebaseapp.com",
      databaseURL: "https://splora-7abad-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "splora-7abad",
      storageBucket: "splora-7abad.firebasestorage.app",
      messagingSenderId: "428570446851",
      appId: "1:428570446851:web:114acfb2d5b892c25c9236",
      measurementId: "G-VPW41W98Q"
    };
const root=document.getElementById('root');
window.addEventListener('error',e=>{
  console.error('SPL Admin runtime error:',e.error||e.message);
  if(root && !root.innerHTML.trim()) root.innerHTML=`<div class="login"><div class="loginCard"><div class="logo">S</div><h1>SPL Admin Panel</h1><div class="status error">Admin panel চালু হতে একটি JavaScript error হয়েছে।</div><p class="hint">পেজটি Refresh করুন। সমস্যা থাকলে Render-এর Deploy Logs দেখুন।</p><button class="btn red full" onclick="location.reload()">REFRESH</button></div></div>`;
});
async function bootFirebase(){
  try{
    const [appMod,authMod,dbMod]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js')
    ]);
    ({initializeApp}=appMod);
    ({getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword,reauthenticateWithCredential,EmailAuthProvider}=authMod);
    ({getDatabase,ref,get,set,update,push,remove,runTransaction,query,orderByChild,equalTo}=dbMod);
    const app=initializeApp(firebaseConfig);
    auth=getAuth(app);
    db=getDatabase(app);
    startAdminAuth();
  }catch(e){
    console.error('Firebase boot failed',e);
    root.innerHTML=`<div class="login"><div class="loginCard"><div class="logo">S</div><h1>SPL Admin Panel</h1><div class="status error">Admin panel load হয়নি। Firebase SDK/network connection পাওয়া যাচ্ছে না।</div><p class="hint">Internet connection পরীক্ষা করে পেজটি Refresh করুন। যদি Render-এ deployment সমস্যা থাকে, /health খুলে সার্ভার চালু আছে কি না দেখুন।</p><button class="btn red full" onclick="location.reload()">REFRESH</button></div></div>`;
  }
}

const state={page:'dashboard',user:null,admin:null,data:{users:{},packages:{},gateways:{},site_settings:{},theme_images:{},support_links:{},app_download_link:'',withdrawal_requests:{},tournaments:{},participants:{},banners:{},notifications:{},leaderboard:{},results:{},matchUpdates:{},admins:{},bonus_codes:{}}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2}),now=()=>Date.now(),fmt=v=>{if(!v)return'—';const d=typeof v==='number'?new Date(v):new Date(v);return isNaN(d)?'—':new Intl.DateTimeFormat('bn-BD',{dateStyle:'medium',timeStyle:'short'}).format(d)};
const msg=e=>{const c=e?.code||'';if(c.includes('invalid-credential')||c.includes('wrong-password'))return'ইমেইল অথবা পাসওয়ার্ড ভুল।';if(c.includes('permission-denied'))return'Firebase permission denied — Database Rules পরীক্ষা করুন।';return e?.message||'কাজটি সম্পন্ন হয়নি।'};
function login(error=''){root.innerHTML=`<div class="login"><div class="loginCard"><div class="logo">S</div><h1>SPL Admin Panel</h1><p class="muted">Secure administration · splora-7abad</p>${error?`<div class="status error">${esc(error)}</div>`:''}<form id="loginForm"><div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" required placeholder="Admin email"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"></div><button class="btn red full" type="submit">LOGIN</button></form><p class="hint" style="margin-top:12px">লগইন করতে Firebase Authentication account এবং <b>admins/{uid}</b>-এ active:true অনুমতি থাকতে হবে।</p></div></div>`;$('loginForm').onsubmit=doLogin}
async function doLogin(e){e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){login(msg(e))}}
async function loadData(){const paths=Object.keys(state.data);const snaps=await Promise.all(paths.map(p=>get(ref(db,p))));paths.forEach((p,i)=>state.data[p]=snaps[i].val()??(p==='app_download_link'?'':{}));}
function nav(p,icon,label){return`<button class="${state.page===p?'active':''}" onclick="go('${p}')"><i data-lucide="${icon}"></i>${label}</button>`}
function layout(content){return`<div class="layout"><aside class="sidebar" id="side"><div class="brand"><div class="brandLogo">S</div><b>SPL ADMIN</b></div><nav class="sideNav"><div class="navGroupWrap"><div class="navGroup">OVERVIEW</div>${nav('dashboard','layout-dashboard','Dashboard')}${nav('users','users','Users')}</div><div class="navGroupWrap"><div class="navGroup">WALLET MANAGEMENT</div>${nav('deposits','wallet','Deposits')}${nav('withdrawals','arrow-up-from-line','Withdrawals')}</div><div class="navGroupWrap"><div class="navGroup">INVESTMENT</div>${nav('packages','package','Packages')}${nav('gateways','credit-card','Payment Gateways')}</div><div class="navGroupWrap"><div class="navGroup">PROMOTION & CONTENT</div>${nav('banners','images','Banners')}${nav('notifications','bell','Notifications')}${nav('site','settings','Site Settings')}</div><div class="navGroupWrap"><div class="navGroup">ADMINISTRATION</div>${nav('admins','shield-check','Admin Access')}</div><button onclick="logout()" style="margin-top:12px"><i data-lucide="log-out"></i> Logout</button></nav></aside><div class="drawerOverlay" id="overlay" onclick="closeSide()"></div><main class="main"><header class="top"><button class="mobileMenu" onclick="openSide()"><i data-lucide="menu"></i></button><b>${esc(pageTitle(state.page))}</b><button class="btn light" onclick="refresh()">↻ Refresh</button></header><section class="content">${content}</section></main></div>`}
function pageTitle(p){return({dashboard:'Dashboard',users:'Users',deposits:'Deposits / NEKpay Orders',withdrawals:'Withdrawal Requests',packages:'Packages',gateways:'Gateway Settings',tournaments:'Tournaments',participants:'Participants',leaderboard:'Leaderboard',banners:'Banners',notifications:'Notifications',site:'Site Settings',admins:'Admin Access'})[p]||p}
function metric(label,value){return`<div class="metric"><small>${label}</small><strong>${value}</strong></div>`}
function dashboard(){const users=Object.values(state.data.users||{}),deps=collectDeposits(),wds=Object.values(state.data.withdrawal_requests||{}),pendDep=deps.filter(x=>!isSuccess(x.status)&&!isFailed(x.status)),pendWd=wds.filter(x=>!isProcessed(x.status));let totalBal=users.reduce((s,u)=>s+Number(u.balance||0),0);return`<div class="title"><div><h1>Dashboard</h1><span class="muted">User Panel-এর লাইভ ডেটা</span></div></div><div class="cards">${metric('মোট ইউজার',users.length)}${metric('মোট ওয়ালেট ব্যালেন্স',money(totalBal))}${metric('ডিপোজিট রেকর্ড',deps.length)}${metric('Pending Deposit',pendDep.length)}${metric('Pending Withdrawal',pendWd.length)}${metric('Packages',Object.keys(state.data.packages||{}).length)}${metric('Gift Codes',Object.keys(state.data.bonus_codes||{}).length)}${metric('Active Users',users.filter(u=>!u.isBanned).length)}</div><div class="panel"><h3>দ্রুত কাজ</h3><div class="toolbar"><button class="btn light" onclick="go('deposits')">ডিপোজিট দেখুন</button><button class="btn light" onclick="go('withdrawals')">উইথড্র রিভিউ</button><button class="btn light" onclick="go('users')">ইউজার ম্যানেজ</button><button class="btn light" onclick="go('packages')">প্যাকেজ এডিট</button></div><p class="hint">NEKpay পেমেন্ট সফল হয়েছে কি না, তা Backend-এর verified callback status থেকে দেখা যাবে। HTML থেকে নিজে সফল পেমেন্ট ঘোষণা করা হয় না।</p></div>`}
function userList(){const a=Object.entries(state.data.users||{});return`<div class="title"><div><h1>Users</h1><span class="muted">User key হলো ১১ ডিজিটের ফোন নম্বর</span></div></div><div class="panel"><div class="toolbar"><input id="userSearch" class="search" placeholder="নাম / ফোন / referral code দিয়ে খুঁজুন" oninput="filterUsers()"></div><div id="userRows">${userRows(a)}</div></div>`}
function userRows(a){return`<div class="table"><div class="tr head"><div>User / Phone</div><div>Balance</div><div>Referral</div><div>Status</div><div>Actions</div></div>${a.map(([phone,u])=>`<div class="tr userRow" data-search="${esc((phone+' '+u.name+' '+u.referralCode).toLowerCase())}"><div><b>${esc(u.name||'Unnamed')}</b><br><span class="muted">${esc(phone)}</span></div><div><b>${money(u.balance)}</b></div><div>${esc(u.referralCode||'—')}</div><div><span class="badge ${u.isBanned?'dangerText':'green'}">${u.isBanned?'Banned':'Active'}</span></div><div><button class="btn light" onclick="userDetails('${esc(phone)}')">VIEW</button> <button class="btn ${u.isBanned?'light':'danger'}" onclick="toggleBan('${esc(phone)}',${!!u.isBanned})">${u.isBanned?'UNBAN':'BAN'}</button></div></div>`).join('')||'<div class="empty">কোনো ইউজার পাওয়া যায়নি</div>'}</div>`}
function collectDeposits(){const out=[];for(const [phone,u] of Object.entries(state.data.users||{})){for(const [id,d] of Object.entries(u.deposits||{})){out.push({...d,id,phone,userName:u.name||'',balance:u.balance||0})}}return out.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0))}
function isSuccess(s){return ['success','successful','সফল','approved','paid','1'].includes(String(s||'').toLowerCase())}function isFailed(s){return ['failed','rejected','বাতিল','2','expired'].includes(String(s||'').toLowerCase())}function isProcessed(s){return ['approved','rejected','সফল','সম্পন্ন','paid','completed','অনুমোদিত','অ্যাডমিন দ্বারা সম্পন্ন','বাতিল','টাকা পাঠানো হয়েছে'].includes(String(s||'').toLowerCase())}
function depositsPage(){const a=collectDeposits();return`<div class="title"><div><h1>Deposits / NEKpay Orders</h1><span class="muted">users/{phone}/deposits — User Panel-এর প্রকৃত ডেটা</span></div><div class="toolbar"><button class="btn red" onclick="manualDepositModal()">+ MANUAL DEPOSIT</button><button class="btn light" onclick="refresh()">Refresh</button></div></div><div class="panel"><div class="toolbar"><input id="depSearch" class="search" placeholder="Phone / Order ID / Trx ID খুঁজুন" oninput="filterRows('depSearch','.depRow')"><select id="depStatus" onchange="filterRows('depSearch','.depRow')"><option value="">সব Status</option><option>অপেক্ষমাণ</option><option>success</option><option>সফল</option><option>failed</option></select></div><div class="table"><div class="tr head"><div>User / Order</div><div>Amount / Method</div><div>Transaction ID</div><div>Status / Date</div><div>Action</div></div>${a.map(d=>`<div class="tr depRow" data-search="${esc((d.phone+' '+d.id+' '+(d.out_trade_no||'')+' '+(d.trxId||'')+' '+(d.transactionId||'')).toLowerCase())}" data-status="${esc(d.status||'')}"><div><b>${esc(d.userName)}</b><br>${esc(d.phone)}<br><span class="muted">${esc(d.out_trade_no||d.id)}</span></div><div><b>${money(d.amount)}</b><br>${esc(d.method||'NEKpay')}</div><div>${esc(d.providerTransactionId||d.trxId||d.transactionId||'—')}</div><div><span class="badge ${isSuccess(d.status)?'green':isFailed(d.status)?'dangerText':'amber'}">${esc(d.status||'অপেক্ষমাণ')}</span><br><span class="muted">${fmt(d.createdAt)}</span></div><div><button class="btn light" onclick="depositDetails('${esc(d.phone)}','${esc(d.id)}')">DETAILS</button> ${(!isSuccess(d.status)&&!isFailed(d.status))?`<button class="btn light" onclick="reviewDeposit('${esc(d.phone)}','${esc(d.id)}','approved')">APPROVE</button> <button class="btn danger" onclick="reviewDeposit('${esc(d.phone)}','${esc(d.id)}','rejected')">REJECT</button>`:''}</div></div>`).join('')||'<div class="empty">এখনো কোনো ডিপোজিট নেই</div>'}</div></div><p class="hint">নোট: NEKpay অর্ডার সফল হলে Backend callback users/{phone}/deposits/{orderId} আপডেট করবে। Pending রেকর্ড ম্যানুয়ালি যাচাই করে APPROVE/REJECT করা যায়। NEKpay-এর callback-এ verified status এলে সেটি স্বয়ংক্রিয়ভাবে আপডেট হবে।</p>`}
function withdrawalsPage(){const a=Object.entries(state.data.withdrawal_requests||{}).sort((x,y)=>Number(y[1].createdAt||0)-Number(x[1].createdAt||0));return`<div class="title"><div><h1>Withdrawal Requests</h1><span class="muted">টাকা বাস্তবে পাঠানোর পর Transaction ID / reference দিয়ে সম্পন্ন করুন।</span></div></div><div class="panel"><div class="toolbar"><input id="wdSearch" class="search" placeholder="Phone / name খুঁজুন" oninput="filterRows('wdSearch','.wdRow')"><select id="wdStatusFilter" onchange="filterWithdrawalStatus()"><option value="all">সব</option><option value="pending">অপেক্ষমাণ</option><option value="complete">সম্পূর্ণ</option><option value="failed">ব্যর্থ</option></select></div><div class="table"><div class="tr head"><div>User / Account</div><div>Amount</div><div>Fee / Net</div><div>Status / Date</div><div>Action</div></div>${a.map(([id,w])=>`<div class="tr wdRow" data-search="${esc((w.userPhone+' '+w.userName+' '+w.accountNumber).toLowerCase())}" data-wd-status="${isProcessed(w.status)?(String(w.status).includes('বাতিল')?'failed':'complete'):'pending'}"><div><b>${esc(w.userName||'User')}</b><br>${esc(w.userPhone||'—')}<br><span class="muted">${esc(w.method||'')} · ${esc(w.accountNumber||'')}</span></div><div>${money(w.amount)}</div><div>${money(w.fee)} / ${money(w.netAmount)}</div><div><span class="badge ${isProcessed(w.status)?'green':'amber'}">${esc(w.status||'পেন্ডিং')}</span><br><span class="muted">${fmt(w.createdAt)}</span></div><div>${isProcessed(w.status)?'—':`<button class="btn red" onclick="reviewWithdrawal('${esc(id)}','approved')">টাকা পাঠিয়ে সম্পন্ন</button> <button class="btn danger" onclick="reviewWithdrawal('${esc(id)}','rejected')">REJECT</button>`}</div></div>`).join('')||'<div class="empty">কোনো withdrawal request নেই</div>'}</div></div>`}
function packagesPage(){const a=Object.entries(state.data.packages||{});return`<div class="title"><div><h1>Packages</h1><span class="muted">User Panel packages root path</span></div><button class="btn red" onclick="packageModal()">+ ADD PACKAGE</button></div><div class="panel"><div class="table"><div class="tr head"><div>Package</div><div>Cost / Daily</div><div>Duration</div><div>Limit / Status</div><div>Action</div></div>${a.map(([id,p])=>`<div class="tr"><div><b>${esc(p.name||id)}</b><br><span class="muted">${esc(id)}</span></div><div>${money(p.cost)} / ${money(p.daily)}</div><div>${esc(p.duration||0)} days</div><div>${esc(p.limit??'—')} / ${esc(p.status||'active')}</div><div><button class="btn light" onclick="packageModal('${esc(id)}')">EDIT</button> <button class="btn danger" onclick="deletePackage('${esc(id)}')">DELETE</button></div></div>`).join('')||'<div class="empty">কোনো package নেই</div>'}</div></div>`}

ts" value="${esc((s.withdrawal_quick_amounts||[150,500,1000,2500,5000,10000,20000,50000,100000,300000]).join(','))}"></div></div><button class="btn red" onclick="saveCoreMoneySettings()">SAVE BONUS & WITHDRAWAL SETTINGS</button><p class="hint">নতুন রেজিস্ট্রেশনে নির্ধারিত বোনাস প্রযোজ্য হবে। বিদ্যমান অ্যাকাউন্টে পরিবর্তন হবে না।</p></div><div class="panel"><h3>Withdrawal Schedule & Daily Limit</h3><div class="three"><div class="field"><label>WITHDRAWAL START (DHAKA TIME)</label><input id="withdrawStart" type="time" value="${esc(s.withdrawal_start_time||'10:00')}"></div><div class="field"><label>WITHDRAWAL END (DHAKA TIME)</label><input id="withdrawEnd" type="time" value="${esc(s.withdrawal_end_time||'17:00')}"></div><div class="field"><label>MAX REQUESTS PER USER / DAY</label><input id="withdrawDailyLimit" type="number" min="1" max="50" value="${Number(s.withdrawal_daily_limit||3)}"></div></div><button class="btn red" onclick="saveWithdrawalRules()">SAVE WITHDRAWAL RULES</button><p class="hint">সময় Asia/Dhaka অনুযায়ী গণনা হবে। পরিবর্তন সংরক্ষণের পর User Panel-এ স্বয়ংক্রিয়ভাবে কার্যকর হবে।</p></div><div class="panel"><h3>Referral Commission (Successful Deposit)</h3><div class="three">${[0,1,2].map((n)=>`<div class="field"><label>LEVEL ${n+1} COMMISSION (%)</label><input id="refRate${n+1}" type="number" min="0" max="100" step="0.01" value="${Number((s.referral_commission_rates||[10,2,1])[n]??[10,2,1][n])}"></div>`).join('')}</div><div class="field"><label>REFERRAL PROMO TEXT</label><input id="refPromo" value="${esc(s.referral_promo_text||'')}"></div><button class="btn red" onclick="saveReferralSettings()">SAVE REFERRAL SETTINGS</button><p class="hint">এই হার সফল ডিপোজিটের পরিমাণের ওপর গণনা করতে Backend callback-এ একই commission logic যুক্ত থাকা আবশ্যক। শুধু এখানে হার সেভ করলে পুরোনো package-purchase trigger স্বয়ংক্রিয়ভাবে deposit commission হয়ে যায় না।</p></div><div class="panel"><h3>Lucky Spin Prize Amounts</h3><div class="field"><label>PRIZES (COMMA SEPARATED, BDT)</label><input id="spinPrizes" value="${esc((s.spin_prizes||[20,50,120,347,800,254,90,1000]).join(','))}"></div><button class="btn red" onclick="saveSpinSettings()">SAVE SPIN PRIZES</button></div><div class="panel"><h3>Redeem / Gift Code Create</h3><div class="two"><div class="field"><label>CODE</label><input id="giftCode" placeholder="WELCOME10"></div><div class="field"><label>MAX USERS (0 = UNLIMITED)</label><input id="giftLimit" type="number" value="10"></div><div class="field"><label>MIN BONUS (৳)</label><input id="giftMin" type="number" value="10"></div><div class="field"><label>MAX BONUS (৳)</label><input id="giftMax" type="number" value="20"></div></div><button class="btn red" onclick="createGiftCode()">CREATE / UPDATE CODE</button><div class="table" style="margin-top:14px"><div class="tr head"><div>Code</div><div>Bonus Range</div><div>Claimed / Limit</div><div>Status</div><div>Action</div></div>${Object.entries(state.data.bonus_codes||{}).map(([code,c])=>`<div class="tr"><div><b>${esc(code)}</b></div><div>${money(c.min_amount??c.amount)} - ${money(c.max_amount??c.amount)}</div><div>${Number(c.claimed_count||0)} / ${Number(c.max_claims||0)||'∞'}</div><div>${esc(c.status||'active')}</div><div><button class="btn light" onclick="toggleGiftCode('${esc(code)}','${c.status==='inactive'?'active':'inactive'}')">${c.status==='inactive'?'ACTIVATE':'DISABLE'}</button></div></div>`).join('')||'<div class="empty">No gift codes</div>'}</div><p class="hint">প্রতি ইউজার একই কোড একবারই ব্যবহার করতে পারবে। সীমা ০ দিলে ব্যবহার সংখ্যা সীমাহীন।</p></div><div class="panel"><h3>Common User Texts</h3><div class="two"><div class="field"><label>WITHDRAWAL TITLE</label><input id="txt_lang_w_title" value="${esc((s.editable_texts||{}).lang_w_title||'উত্তোলন রিকোয়েস্ট')}"></div><div class="field"><label>WITHDRAWAL SCHEDULE TEXT</label><input id="txt_withdrawScheduleText" value="${esc((s.editable_texts||{}).withdrawScheduleText||'')}"></div><div class="field"><label>WITHDRAW CANCEL BUTTON</ async function creditReferralCommissionForDeposit(sourcePhone, sourceId, amount){
  const base=Number(amount||0); if(!sourcePhone||!sourceId||!Number.isFinite(base)||base<=0)return;
  const settings=state.data.site_settings||{};
  const rates=(Array.isArray(settings.referral_commission_rates)?settings.referral_commission_rates:[10,2,1]).slice(0,3).map(v=>Math.max(0,Number(v)||0)/100);
  const sourceSnap=await get(ref(db,'users/'+sourcePhone)); if(!sourceSnap.exists())return;
  let parentCode=sourceSnap.val()?.invitedByCode||null;
  for(let level=0;level<rates.length&&parentCode;level++){
    const q=await get(query(ref(db,'users'),orderByChild('referralCode'),equalTo(parentCode)));
    const parents=q.val()||{}, parentPhone=Object.keys(parents)[0]; if(!parentPhone)break;
    const commission=Number((base*rates[level]).toFixed(2));
    if(commission>0){
      const claimRef=ref(db,`referral_commission_claims/${sourceId}/level${level+1}`);
      const claim=await runTransaction(claimRef,v=>v||{sourcePhone,parentPhone,level:level+1,commission,rate:rates[level]*100,createdAt:now()});
      if(claim.committed){
        await runTransaction(ref(db,'users/'+parentPhone),u=>{if(!u)return;u.balance=Number(u.balance||0)+commission;u.referralEarnings=Number(u.referralEarnings||0)+commission;u.referralCommissionLog=u.referralCommissionLog||{};u.referralCommissionLog[`${sourceId}_L${level+1}`]={sourceId,sourcePhone,level:level+1,commission,rate:rates[level]*100,createdAt:now()};return u;});
      }
    }
    parentCode=parents[parentPhone]?.invitedByCode||null;
  }
}

function manualDepositModal(){ const users=Object.entries(state.data.users||{}); modal(`<div class="modalHead"><h2>Manual Deposit — Instant Approve</h2><button class="close" onclick="closeModal()">×</button></div> <div class="field"><label>USER PHONE</label><select id="manualDepPhone">${users.map(([p,u])=>`<option value="${esc(p)}">${esc(p)} — ${esc(u.name||'User')}</option>`).join('')}</select></div> <div class="two"><div class="field"><label>AMOUNT (BDT)</label><input id="manualDepAmount" type="number" min="1" step="0.01"></div> <div class="field"><label>METHOD</label><select id="manualDepMethod"><option value="bkash">bKash</option><option value="nagad">Nagad</option><option value="rocket">Rocket</option><option value="manual">Manual</option></select></div></div> <div class="field"><label>TRANSACTION ID (OPTIONAL — NOT REQUIRED)</label><input id="manualDepTrx" placeholder="Optional"></div> <div class="field"><label>NOTE (OPTIONAL)</label><input id="manualDepNote" placeholder="Admin note"></div> <button class="btn red full" onclick="saveManualDeposit()">ADD & APPROVE NOW</button>`);}async function saveManualDeposit(){ const phone=$('manualDepPhone').value, amount=Number($('manualDepAmount').value), method=$('manualDepMethod').value, trx=$('manualDepTrx').value.trim(), note=$('manualDepNote').value.trim(); if(!phone||!Number.isFinite(amount)||amount<=0)return alert('সঠিক User ও Amount দিন'); try{  const userRef=ref(db,`users/${phone}`);  const id=push(ref(db,`users/${phone}/deposits`)).key;  const tx=await runTransaction(userRef,u=>{   if(!u)return;   u.balance=Number(u.balance||0)+amount;   u.deposits=u.deposits||{};   u.depositCredits=u.depositCredits||{};   u.deposits[id]={amount,method,status:'সফল',trxId:trx||`MANUAL-${id}`,out_trade_no:id,manual:true,adminApproved:true,adminUid:state.user.uid,note,createdAt:now(),creditedAt:now(),date:new Date().toLocaleDateString('bn-BD')};   u.depositCredits[id]={amount,manual:true,adminUid:state.user.uid,creditedAt:now()};   return u;  });  if(!tx.committed)return alert('User পাওয়া যায়নি');  await creditReferralCommissionForDeposit(phone,id,amount);  closeModal();await refresh();alert('Manual deposit সাথে সাথে Approved হয়েছে — কোনো আলাদা verification permission লাগবে না'); }catch(e){alert(msg(e))}}
async function reviewDeposit(phone,id,decision){const d=state.data.users?.[phone]?.deposits?.[id];if(!d)return;if(isSuccess(d.status)||isFailed(d.status))return alert('এই ডিপোজিট আগে process করা হয়েছে');let verificationRef='';if(decision==='approved'){verificationRef=prompt('পেমেন্ট যাচাইয়ের Transaction ID / ব্যাংক রেফারেন্স লিখুন (নিজে যাচাই না করে Approve করবেন না):','')||'';if(!verificationRef.trim())return alert('যাচাইয়ের রেফারেন্স ছাড়া Approve করা যাবে না');if(!confirm(`${money(d.amount)} টাকা বাস্তবে পেয়েছেন এবং রেফারেন্স ${verificationRef} যাচাই করেছেন?`))return;}else if(!confirm('এই ডিপোজিট Reject করবেন?'))return;try{const amount=Number(d.amount||0);if(!Number.isFinite(amount)||amount<=0)throw Error('Invalid deposit amount');const userRef=ref(db,`users/${phone}`);const tx=await runTransaction(userRef,u=>{if(!u||!u.deposits||!u.deposits[id]||isSuccess(u.deposits[id].status)||isFailed(u.deposits[id].status))return;u.depositCredits=u.depositCredits||{};const dep=u.deposits[id];if(decision==='approved'){if(!u.depositCredits[id]){u.balance=Number(u.balance||0)+amount;u.depositCredits[id]={amount,manual:true,verificationRef:verificationRef.trim(),creditedAt:now()};}dep.status='সফল';dep.adminReviewed=true;dep.verificationRef=verificationRef.trim();dep.creditedAt=now();}else{dep.status='বাতিল';dep.adminReviewed=true;}dep.reviewedAt=now();dep.reviewedBy=state.user.uid;u.deposits[id]=dep;return u;});if(!tx.committed)return alert('এই ডিপোজিট আগে process হয়েছে অথবা ইউজার পাওয়া যায়নি');if(decision==='approved'){await creditReferralCommissionForDeposit(phone,id,amount);}await refresh();alert(decision==='approved'?'যাচাইকৃত ডিপোজিট Approve হয়েছে':'ডিপোজিট Reject হয়েছে')}catch(e){alert(msg(e))}}
async function reviewWithdrawal(id,status){
 const w=state.data.withdrawal_requests[id];
 if(!w)return;
 if(isProcessed(w.status))return alert('এই request আগে process করা হয়েছে');
 if(status==='rejected'&&!confirm('এই উত্তোলন আবেদন Reject করবেন?'))return;
 let payoutReference='';

async function savePackage(oldId){const id=$('pId').value.trim();if(!id||!$('pName').value.trim())return alert('Package ID ও Name প্রয়োজন');const p={id,name:$('pName').value.trim(),cost:Number($('pCost').value||0),daily:Number($('pDaily').value||0),duration:Number($('pDuration').value||0),limit:Number($('pLimit').value||1),img:$('pImg').value.trim(),status:$('pStatus').value};try{await set(ref(db,'packages/'+id),p);closeModal();await refresh()}catch(e){alert(msg(e))}}async function deletePackage(id){if(!confirm('Package delete করবেন?'))return;await remove(ref(db,'packages/'+id));await refresh()}

async function saveSite(){const old=state.data.site_settings||{},min=Number($('minRecharge').value||500),max=Number($('maxRecharge').value||500000),quick=$('depositQuickAmounts').value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isFinite(x)&&x>0);if(min<1||max<min||!quick.length||quick.some(x=>x<min||x>max))return alert('Recharge limits এবং quick amounts সঠিকভাবে দিন');const s={...old,brand_name:$('brand').value.trim()||'SPL',payment_number:$('paynum').value.trim(),recharge_min_amount:min,recharge_max_amount:max,deposit_min_amount:min,deposit_max_amount:max,deposit_quick_amounts:[...new Set(quick)]};try{await set(ref(db,'site_settings'),s);await refresh();alert('Site settings saved')}catch(e){alert(msg(e))}}

async function saveCommonTexts(){const old={...(state.data.site_settings?.editable_texts||{})};const ids=['lang_w_title','withdrawScheduleText','lang_w_cancel','lang_w_confirm','regTitleText','regSubmitText','regLoginText','regNamePlaceholder','regPhonePlaceholder','regPasswordPlaceholder','regInvitePlaceholder','withdrawInputPlaceholder'];const map={...old};ids.forEach(id=>{const el=$('txt_'+id);if(el)map[id]=el.value.trim();});try{await update(ref(db,'site_settings'),{editable_texts:map});await refresh();alert('Common texts saved')}catch(e){alert(msg(e))}}
async function saveEditableTexts(){try{const raw=$('editableTextsJson').value.trim()||'{}';const map=JSON.parse(raw);if(!map||typeof map!=='object'||Array.isArray(map))throw Error('JSON object দিন');await update(ref(db,'site_settings'),{editable_texts:map});await refresh();alert('User text overrides saved')}catch(e){alert('Text JSON ভুল: '+e.message)}}async function saveWithdrawalRules(){const start=$('withdrawStart').value||'10:00',end=$('withdrawEnd').value||'17:00',limit=Number($('withdrawDailyLimit').value||3);if(start>=end)return alert('শেষ সময় শুরুর সময়ের পরে হতে হবে');if(!Number.isInteger(limit)||limit<1||limit>50)return alert('দৈনিক সীমা ১ থেকে ৫০-এর মধ্যে দিন');const s={...(state.data.site_settings||{}),withdrawal_start_time:start,withdrawal_end_time:end,withdrawal_daily_limit:limit};try{await update(ref(db,'site_settings'),{withdrawal_start_time:start,withdrawal_end_time:end,withdrawal_daily_limit:limit});await refresh();alert('Withdrawal rules saved')}catch(e){alert(msg(e))}}
async function saveReferralSettings(){const rates=[1,2,3].map(n=>Number($('refRate'+n).value||0));if(rates.some(v=>v<0||v>100))return alert('প্রতিটি কমিশন ০ থেকে ১০০ শতাংশের মধ্যে দিন');const s={...(state.data.site_settings||{}),referral_commission_rates:rates,referral_commission_percent:rates[0],referral_promo_text:$('refPromo').value.trim()};try{await set(ref(db,'site_settings'),s);await refresh();alert('Referral rates saved')}catch(e){alert(msg(e))}}

async function saveImages(){const im={};for(const k of ['login_banner','register_banner','slide1','slide2','slide3','slide4'])im[k]=$('img_'+k).value.trim();for(const k of ['slide1','slide2','slide3','slide4'])im[k+'_link']=$('link_'+k)?.value.trim()||'';try{await set(ref(db,'theme_images'),im);await refresh();alert('Images saved')}catch(e){alert(msg(e))}}

function localInput(v){if(!v)return'';const d=new Date(Number(v));if(isNaN(d))return'';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function tournamentModal(id=''){const t=state.data.tournaments?.[id]||{};modal(`<div class="modalHead"><h2>${id?'Edit':'Create'} Tournament</h2><button class="close" onclick="closeModal()">×</button></div><div class="two"><div class="field"><label>NAME</label><input id="tName" value="${esc(t.name||'')}"></div><div class="field"><label>MODE</label><select id="tMode"><option>Solo</option><option ${t.mode==='Duo'?'selected':''}>Duo</option><option ${t.mode==='Squad'?'selected':''}>Squad</option></select></div><div class="field"><label>MAP</label><input id="tMap" value="${esc(t.map||'Bermuda')}"></div><div class="field"><label>ENTRY FEE</label><input id="tFee" type="number" value="${Number(t.entryFee||0)}"></div><div class="field"><label>PRIZE POOL</label><input id="tPrize" type="number" value="${Number(t.prizePool||0)}"></div><div class="field"><label>SLOTS</label><input id="tSlots" type="number" value="${Number(t.slots||48)}"></div><div class="field"><label>START TIME</label><input id="tStart" type="datetime-local" value="${localInput(t.startAt)}"></div><div class="field"><label>END TIME</label><input id="tEnd" type="datetime-local" value="${localInput(t.endAt)}"></div><div class="field"><label>REGISTRATION CLOSE</label><input id="tClose" type="datetime-local" value="${localInput(t.registrationCloseAt)}"></div><div class="field"><label>ROOM REVEAL</label><input id="tReveal" type="datetime-local" value="${localInput(t.roomRevealAt)}"></div><div class="field"><label>BANNER URL</label><input id="tBanner" value="${esc(t.banner||'')}"></div><div class="field"><label>LOGO URL</label><input id="tLogo" value="${esc(t.logo||'')}"></div></div><div class="field"><label>DESCRIPTION</label><textarea id="tDesc">${esc(t.description||'')}</textarea></div><div class="field"><label>RULES</label><textarea id="tRules">${esc(t.rules||'')}</textarea></div><button class="btn red full" onclick="saveTournament('${esc(id)}')">SAVE TOURNAMENT</button>`)}
function dateVal(id){const v=$(id).value;return v?new Date(v).getTime():0}async function saveTournament(id){const key=id||push(ref(db,'tournaments')).key;const old=state.data.tournaments?.[id]||{};const t={id:key,name:$('tName').value.trim(),mode:$('tMode').value,map:$('tMap').value.trim(),entryFee:Number($('tFee').value||0),prizePool:Number($('tPrize').value||0),slots:Number($('tSlots').value||0),startAt:dateVal('tStart'),endAt:dateVal('tEnd'),registrationCloseAt:dateVal('tClose'),roomRevealAt:dateVal('tReveal'),banner:$('tBanner').value.trim(),logo:$('tLogo').value.trim(),description:$('tDesc').value,rules:$('tRules').value,createdAt:old.createdAt||now(),updatedAt:now(),active:old.active!==false};if(!t.name||!t.startAt||!t.endAt)return alert('Name, start ও end time দিন');try{await set(ref(db,'tournaments/'+key),t);closeModal();await refresh()}catch(e){alert(msg(e))}}
function roomModal(id){const t=state.data.tournaments[id]||{};modal(`<div class="modalHead"><h2>Room Details</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>ROOM ID</label><input id="roomId" value="${esc(t.roomId||'')}"></div><div class="field"><label>ROOM PASSWORD</label><input id="roomPw" value="${esc(t.roomPassword||'')}"></div><div class="field"><label>ROOM REVEAL TIME</label><input id="roomReveal" type="datetime-local" value="${localInput(t.roomRevealAt)}"></div><button class="btn red full" onclick="saveRoom('${esc(id)}')">SAVE ROOM</button>`)}async function saveRoom(id){try{await update(ref(db,'tournaments/'+id),{roomId:$('roomId').value.trim(),roomPassword:$('roomPw').value.trim(),roomRevealAt:dateVal('roomReveal'),updatedAt:now()});closeModal();await refresh()}catch(e){alert(msg(e))}}
function bannerModal(id=''){const b=state.data.banners?.[id]||{};modal(`<div class="modalHead"><h2>${id?'Edit':'Add'} Banner</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>TITLE</label><input id="bTitle" value="${esc(b.title||'')}"></div><div class="field"><label>SUBTITLE</label><input id="bSub" value="${esc(b.subtitle||'')}"></div><div class="field"><label>IMAGE URL</label><input id="bImage" value="${esc(b.image||'')}"></div><div class="field"><label>CLICK URL</label><input id="bClick" value="${esc(b.clickUrl||'')}"></div><div class="two"><div class="field"><label>ORDER</label><input id="bOrder" type="number" value="${Number(b.order||0)}"></div><div class="field"><label>ACTIVE</label><select id="bActive"><option value="true" ${b.active!==false?'selected':''}>YES</option><option value="false" ${b.active===false?'selected':''}>NO</option></select></div></div><button class="btn red full" onclick="saveBanner('${esc(id)}')">SAVE BANNER</button>`)}async function saveBanner(id){const key=id||push(ref(db,'banners')).key;const b={id:key,title:$('bTitle').value.trim(),subtitle:$('bSub').value.trim(),image:$('bImage').value.trim(),clickUrl:$('bClick').value.trim(),order:Number($('bOrder').value||0),active:$('bActive').value==='true',updatedAt:now()};if(!b.title)return alert('Title দিন');await set(ref(db,'banners/'+key),b);closeModal();await refresh()}
function notificationModal(){modal(`<div class="modalHead"><h2>Send Notification</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>TITLE</label><input id="nTitle"></div><div class="field"><label>USER PHONE (blank = global)</label><input id="nUser"></div><div class="field"><label>MESSAGE</label><textarea id="nMsg" rows="4"></textarea></div><button class="btn red full" onclick="saveNotification()">PUBLISH</button>`)}async function saveNotification(){const id=push(ref(db,'notifications')).key,n={id,title:$('nTitle').value.trim(),userId:$('nUser').value.trim()||null,message:$('nMsg').value.trim(),read:false,createdAt:now()};if(!n.title||!n.message)return alert('Title ও message দিন');await set(ref(db,'notifications/'+id),n);closeModal();await refresh()}
async function changeAdminPassword(){const old=$('oldPass').value,n=$('newPass').value;if(!old||n.length<8)return $('passMsg').innerHTML='<div class="status error">বর্তমান পাসওয়ার্ড দিন এবং নতুন পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের করুন।</div>';try{await reauthenticateWithCredential(state.user,EmailAuthProvider.credential(state.user.email,old));await updatePassword(state.user,n);$('passMsg').innerHTML='<div class="status ok">Password updated.</div>'}catch(e){$('passMsg').innerHTML=`<div class="status error">${esc(msg(e))}</div>`}}
